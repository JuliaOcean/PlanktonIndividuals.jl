name: Documentation

on:
  push:
    branches:
      - master
    tags: 
      - '*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/checkout@v4
        with:
          repository: JuliaOcean/PlanktonKernels.jl
          path: deps/PlanktonKernels.jl
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1.13'
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop([PackageSpec(path="deps/PlanktonKernels.jl"), PackageSpec(path=pwd())]); Pkg.instantiate()'
      - name: Build and deploy
        run: julia --project=docs/ --code-coverage=user docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: 100
